name: Linear bug scan

on:
  schedule:
    # Every Monday 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan-and-track:
    name: Sync BUG_REPORT.md → GitHub issue summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse BUG_REPORT and open/update tracker issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'BUG_REPORT.md';
            if (!fs.existsSync(path)) {
              core.warning('BUG_REPORT.md not found — skip');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            const title = 'Periodic bug scan: BUG_REPORT.md tracker';
            const marker = '<!-- linear-bug-scan -->';
            const issueBody = [
              marker,
              '',
              'Automated weekly scan of `BUG_REPORT.md`.',
              '',
              '**Repo:** https://github.com/olekariamunyororo-crypto/threejs-punk-adam',
              '**Linear team:** Threejspunk-adam (THR)',
              '',
              'High-priority items are tracked in Linear (THR-5 …).',
              'This workflow does **not** auto-apply code fixes — use Linear + human/agent review.',
              '',
              '### Snapshot (first 80 lines of BUG_REPORT.md)',
              '```markdown',
              body.split('\n').slice(0, 80).join('\n'),
              '```',
              '',
              'Full report: [`BUG_REPORT.md`](./BUG_REPORT.md)',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug-scan',
              per_page: 20,
            });
            const existing = issues.find((i) => (i.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body: issueBody,
              });
              core.info(`Updated issue #${existing.number}`);
            } else {
              // Ensure label exists
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'bug-scan',
                  color: 'B60205',
                  description: 'Periodic BUG_REPORT.md scan',
                });
              } catch (_) { /* already exists */ }
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: issueBody,
                labels: ['bug-scan'],
              });
              core.info(`Created issue #${created.number}`);
            }
